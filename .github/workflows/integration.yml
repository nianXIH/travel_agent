name: Integration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration
  cancel-in-progress: false

jobs:
  integration:
    # Dedicated runner with MongoDB, Milvus and the BGE-m3 cache available.
    # Stop the API service first on single-GPU machines to avoid VRAM contention.
    runs-on: [self-hosted, travel-kb]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Integration tests
        run: python -m pytest -m integration -q
